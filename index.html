<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đơn từ Panel Home</title>
<meta name="description" content="Gửi và duyệt đơn nghỉ phép, đi muộn, về sớm của Panel Home – Bảo Tín">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#15653e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Đơn từ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #f3f5f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - env(safe-area-inset-top)); border: 0; background: #f3f5f4; }
  #bar { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 10;
         display: none; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; border-radius: 16px;
         background: #17251d; color: #fff; box-shadow: 0 8px 28px rgba(0,0,0,.28); font-size: 15px; line-height: 1.4; }
  #bar.show { display: flex; }
  #bar p { margin: 0; flex: 1; }
  #bar button { border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  #ok { background: #2fb171; color: #fff; padding: 10px 14px; white-space: nowrap; }
  #x { background: transparent; color: #b9c7bf; padding: 8px; font-size: 18px; line-height: 1; }
  #lg { position: fixed; inset: 0; z-index: 5; background: #f3f5f4; display: none; overflow: auto; padding: max(24px, env(safe-area-inset-top)) 20px 24px; box-sizing: border-box; }
  #lg.show { display: flex; align-items: flex-start; justify-content: center; }
  #lg form { width: 100%; max-width: 420px; margin-top: 8vh; background: #fff; border: 1px solid #d9e1dd; border-radius: 14px; padding: 22px; box-sizing: border-box; color: #14221e; }
  #lg h2 { margin: 0 0 4px; font-size: 1.35rem; }
  #lg p { margin: 0 0 14px; color: #566862; font-size: .9rem; }
  #lg label { display: block; margin: 12px 0 6px; font-weight: 600; font-size: .9rem; }
  #lg input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 12px; border: 1px solid #b9c6c0; border-radius: 10px; background: #fff; color: inherit; }
  #lg #le { color: #a8201a; background: #fae1de; padding: 8px 10px; border-radius: 8px; margin: 12px 0 0; }
  #lg #lb { width: 100%; margin-top: 16px; border: 0; border-radius: 10px; background: #0a6b5d; color: #fff; font: inherit; font-weight: 600; padding: 13px; cursor: pointer; }
  #lg #lb:disabled { opacity: .6; }
  #lg #lfid { width: 100%; margin: 14px 0 4px; border: 0; border-radius: 10px; background: #14221e; color: #fff; font: inherit; font-weight: 600; padding: 14px; cursor: pointer; display: none; }
  #lg #lfid.show { display: block; }
  #lg #lfid:disabled { opacity: .6; }
  #lg .or { text-align: center; color: #7a8b85; font-size: .8rem; margin: 10px 0 0; display: none; }
  #lg .or.show { display: block; }
  #lg #ls { display: block; margin: 12px auto 0; background: none; border: 0; color: #566862; font: inherit; font-size: .85rem; text-decoration: underline; cursor: pointer; }
  @media (min-width: 640px) { #bar { left: auto; right: 20px; max-width: 460px; } }
</style>
</head>
<body>
<iframe id="app" title="Đơn từ Panel Home" allow="clipboard-write"></iframe>
<div id="lg"><form id="lf" method="post" action="#" autocomplete="on">
  <h2>Đăng nhập</h2><p>Nhập mã nhân viên và mã PIN do nhân sự cấp. Sau khi vào được, bật Face ID để lần sau không phải gõ lại.</p>
  <button id="lfid" type="button">Đăng nhập bằng Face ID</button><div class="or" id="lor">hoặc dùng mã PIN</div>
  <label for="lu">Mã nhân viên</label><input id="lu" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false">
  <label for="lp">Mã PIN</label><input id="lp" name="password" type="password" inputmode="numeric" autocomplete="current-password">
  <div id="le" hidden></div>
  <button id="lb" type="submit">Vào</button>
  <button id="ls" type="button">Dùng ô đăng nhập khác</button>
</form></div>
<div id="bar" role="status" aria-live="polite"><p id="msg"></p><button id="ok" type="button"></button><button id="x" type="button" aria-label="Để sau">✕</button></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
(function () {
  'use strict';
  const C = self.DONTU;
  const $ = id => document.getElementById(id);
  const tab = new URLSearchParams(location.search).get('tab');
  $('app').src = C.EXEC + (tab ? '?tab=' + encodeURIComponent(tab) : '');

  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const device = ios ? 'iPhone' : android ? 'Android' : 'May tinh';
  const supported = 'serviceWorker' in navigator && 'Notification' in window && 'PushManager' in window;
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  let appWin = null, appOrigin = null, user = null, swReg = null, messaging = null, lastToken = '';

  /* ---------- thanh nhắc phía dưới ---------- */
  let onOk = null, barKey = '', hideTimer = 0;
  function showBar(text, okText, ok, key, autoHide) {
    if (key && Number(ls.get('dt_skip_' + key) || 0) > Date.now()) return;
    clearTimeout(hideTimer);
    $('msg').textContent = text; $('ok').textContent = okText; onOk = ok; barKey = key || '';
    $('bar').classList.add('show');
    if (autoHide) hideTimer = setTimeout(hideBar, autoHide);
  }
  function hideBar() { $('bar').classList.remove('show'); }
  $('ok').addEventListener('click', () => { const f = onOk; hideBar(); if (f) f(); });
  $('x').addEventListener('click', () => { if (barKey) ls.set('dt_skip_' + barKey, String(Date.now() + 3 * 864e5)); hideBar(); });

  /* ---------- Firebase ---------- */
  async function initFb() {
    if (messaging) return messaging;
    if (!supported) return null;
    swReg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    if (!firebase.apps.length) firebase.initializeApp(C.FIREBASE);
    const ok = await Promise.resolve(firebase.messaging.isSupported());
    if (!ok) return null;
    messaging = firebase.messaging();
    /* App đang mở: tự hiện thông báo và làm mới danh sách đơn. */
    messaging.onMessage(p => {
      const n = p.notification || {}, d = p.data || {};
      swReg.showNotification(n.title || d.title || 'Đơn từ', { body: n.body || d.body || '', icon: 'icon-192.png', tag: 'dontu-fg', data: { link: d.link || location.href } });
      toApp({ type: 'refresh' });
    });
    return messaging;
  }
  async function sendToken() {
    const m = await initFb();
    if (!m) { showBar('Máy này chưa hỗ trợ thông báo. iPhone cần iOS 16.4 trở lên và mở app từ biểu tượng ngoài màn hình chính.', 'Đã hiểu', null, 'unsup'); return; }
    const t = await m.getToken({ vapidKey: C.VAPID, serviceWorkerRegistration: swReg });
    if (t) { lastToken = t; toApp({ type: 'token', token: t, thietBi: device }); }
  }
  async function enable() {
    try {
      const p = await Notification.requestPermission();
      if (p === 'granted') await sendToken();
      else showDenied();
    } catch (e) {
      showBar('Chưa bật được thông báo: ' + (e && e.message || e), 'Thử lại', enable, '');
    }
  }
  function showDenied() {
    showBar(ios ? 'Thông báo đang bị tắt. Vào Cài đặt → Thông báo → Đơn từ → bật Cho phép thông báo.'
                : 'Thông báo đang bị chặn. Bấm biểu tượng ổ khóa/⋮ → Cài đặt trang → Thông báo → Cho phép.', 'Đã hiểu', null, 'denied');
  }
  function onLogin() {
    if (ios && !standalone) {
      showBar('Để nhận thông báo trên iPhone: bấm nút Chia sẻ rồi chọn "Thêm vào Màn hình chính", sau đó mở app từ biểu tượng Đơn từ.', 'Đã hiểu', null, 'ios');
      return;
    }
    if (!supported) return;
    const p = Notification.permission;
    if (p === 'granted') sendToken().catch(e => console.warn(e));
    else if (p === 'default') showBar('Bật thông báo để điện thoại báo ngay khi có đơn mới hoặc đơn của bạn có kết quả.', 'Bật thông báo', enable, 'ask');
    else showDenied();
  }

  /* ---------- Face ID (passkey) ---------- */
  const RPID = location.hostname;
  const canPk = !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
  const u8 = s => { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
  const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const pend = {}; let rid = 0;
  function rpc(action, p, useAuth) {
    return new Promise((res, rej) => {
      if (!appWin) { rej(new Error('App chưa sẵn sàng, thử lại sau vài giây.')); return; }
      const id = ++rid; pend[id] = { res, rej };
      toApp({ type: 'rpc', id: id, action: action, p: p || {}, useAuth: !!useAuth });
      setTimeout(() => { if (pend[id]) { delete pend[id]; rej(new Error('Hết thời gian chờ máy chủ.')); } }, 25000);
    });
  }
  function pkErr(e) {
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'AbortError') return 'Đã hủy hoặc Face ID không nhận ra. Thử lại hoặc dùng mã PIN.';
    return (e && e.message) || 'Lỗi không rõ';
  }
  let pre = null;
  function prefetch() { rpc('pkChal', {}, false).then(c => { pre = { c: c, t: Date.now() }; }).catch(() => {}); }
  async function takeChal() {
    if (pre && Date.now() - pre.t < 240000) { const c = pre.c; pre = null; return c; }
    return rpc('pkChal', {}, false);
  }
  async function enrollFaceId() {
    try {
      const c = await takeChal();
      const cred = await navigator.credentials.create({ publicKey: {
        challenge: u8(c.challenge), rp: { name: 'Đơn từ Panel Home', id: RPID },
        user: { id: new TextEncoder().encode(user.maNV), name: user.maNV, displayName: user.ten || user.maNV },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'required', requireResidentKey: true, userVerification: 'required' },
        attestation: 'none', timeout: 60000 } });
      const r = cred.response;
      await rpc('pkReg', { credId: b64(cred.rawId), clientDataJSON: b64(r.clientDataJSON), spki: b64(r.getPublicKey()) }, true);
      ls.set('dt_pk', '1'); ls.set('dt_pk_' + user.maNV, '1');
      showBar('Đã bật Face ID. Lần sau mở app chỉ cần Face ID.', 'OK', null, '', 6000);
    } catch (e) { showBar('Chưa bật được Face ID: ' + pkErr(e), 'Đã hiểu', null, ''); }
    setTimeout(onLogin, 300);
  }
  let viaFace = false;
  async function faceLogin(auto) {
    const b = $('lfid'); b.disabled = true; b.textContent = 'Đang xác thực…';
    try {
      const c = await takeChal();
      const a = await navigator.credentials.get({ publicKey: { challenge: u8(c.challenge), rpId: RPID, userVerification: 'required', timeout: 60000 } });
      const r = a.response;
      const out = await rpc('pkLogin', { credId: b64(a.rawId), clientDataJSON: b64(r.clientDataJSON), authData: b64(r.authenticatorData), sig: b64(r.signature) }, false);
      viaFace = true;
      toApp({ type: 'dologin', maNV: out.maNV, tok: out.tok });
    } catch (e) {
      b.disabled = false; b.textContent = 'Đăng nhập bằng Face ID'; prefetch();
      if (auto !== true) { const m = $('le'); m.hidden = false; m.textContent = pkErr(e); }
    }
  }
  $('lfid').addEventListener('click', () => faceLogin(false));
  let autoTried = false;

  /* ---------- ô đăng nhập ở trang chính (để iPhone lưu mật khẩu bằng Keychain) ---------- */
  let skipLg = false;
  function showLg(msg) {
    if (skipLg) return;
    const e = $('le'); e.hidden = !msg; e.textContent = msg || '';
    $('lb').disabled = false; $('lb').textContent = 'Vào';
    $('lg').classList.add('show');
    if (canPk) { $('lfid').classList.add('show'); $('lor').classList.add('show'); $('lfid').disabled = false; $('lfid').textContent = 'Đăng nhập bằng Face ID'; }
    if (canPk && !autoTried && !msg && ls.get('dt_pk') === '1') { autoTried = true; faceLogin(true); }
    else if (canPk) prefetch();
  }
  function hideLg() { $('lg').classList.remove('show'); $('lp').value = ''; }
  $('lf').addEventListener('submit', ev => {
    ev.preventDefault();
    const ma = $('lu').value.trim().toUpperCase(), pin = $('lp').value.trim();
    if (!ma || !pin) { showLg('Nhập mã nhân viên và mã PIN.'); return; }
    $('lb').disabled = true; $('lb').textContent = 'Đang vào…';
    toApp({ type: 'dologin', maNV: ma, pin: pin });
  });
  $('ls').addEventListener('click', () => { skipLg = true; $('lg').classList.remove('show'); });

  /* ---------- nói chuyện với app đơn từ (Apps Script) bên trong ---------- */
  function toApp(m) { if (appWin) appWin.postMessage(Object.assign({ src: 'dontu-shell' }, m), appOrigin); }
  window.addEventListener('message', e => {
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)) return;
    const d = e.data || {};
    if (d.src !== 'dontu') return;
    appWin = e.source; appOrigin = e.origin;
    if (d.type === 'needlogin') showLg(d.msg);
    else if (d.type === 'login') {
      hideLg(); user = { maNV: d.maNV, ten: d.ten };
      const wasFace = viaFace; viaFace = false;
      const key = 'dt_pk_' + d.maNV;
      if (canPk && !wasFace && ls.get(key) !== '1' && Number(ls.get('dt_skip_pk') || 0) < Date.now()) {
        prefetch();
        showBar('Bật Face ID để lần sau vào app không cần gõ mã PIN?', 'Bật Face ID', enrollFaceId, 'pk');
      } else onLogin();
    }
    else if (d.type === 'rpcres' && pend[d.id]) {
      const h = pend[d.id]; delete pend[d.id];
      try { const r = JSON.parse(d.res); r.ok ? h.res(r.data) : h.rej(new Error(r.error)); } catch (x) { h.rej(new Error('Phản hồi không hợp lệ.')); }
    }
    else if (d.type === 'remember' && d.auth && d.auth.maNV && d.auth.pin) ls.set('dt_auth_v1', JSON.stringify({ maNV: String(d.auth.maNV), pin: String(d.auth.pin) }));
    else if (d.type === 'ask') { let a = null; try { a = JSON.parse(ls.get('dt_auth_v1') || 'null'); } catch (x) {} toApp({ type: 'saved', auth: a }); }
    else if (d.type === 'forget') { try { localStorage.removeItem('dt_auth_v1'); } catch (x) {} }
    else if (d.type === 'logout') { user = null; hideBar(); try { localStorage.removeItem('dt_auth_v1'); } catch (x) {} }
    else if (d.type === 'registered') {
      const k = 'dt_ok_' + (user && user.maNV) + '_' + lastToken.slice(-12);
      if (!ls.get(k)) { ls.set(k, '1'); showBar('Đã bật thông báo cho ' + (user ? user.ten : 'bạn') + ' trên máy này.', 'OK', null, '', 5000); }
    }
    else if (d.type === 'regfail') showBar('Chưa lưu được thiết bị: ' + (d.msg || ''), 'Thử lại', () => sendToken().catch(() => {}), '');
  });

  /* Đăng ký service worker sớm để Android/Chrome nhận diện là app cài được. */
  if (supported) navigator.serviceWorker.register('firebase-messaging-sw.js').catch(() => {});
})();
</script>
</body>
</html>
